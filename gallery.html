        .gallery-item {

            box-shadow: none !important;

        }

            .gallery-item {

        }

        .gallery-item:hover {

            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            transition: transform 0.2s ease;
        }

        .gallery-overlay {
            display: none !important;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;

    <script>
        // Header scroll effect
        let lastScrollTop = 0;
        const header = document.querySelector('header');
        
        function handleScroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            
            lastScrollTop = scrollTop;
        }
        
        window.addEventListener('scroll', handleScroll);
        
        // Mobile menu toggle
        document.getElementById('mobileMenuToggle').addEventListener('click', function() {
            const mobileNav = document.getElementById('mobileNav');
            mobileNav.classList.toggle('active');
        });

        // Gallery filtering
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Update active button
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Filter gallery items by showing/hiding, then recreate Masonry
                const category = this.getAttribute('data-category');
                const items = document.querySelectorAll('.gallery-item');
                
                // Step 1: Show/hide items based on filter
                items.forEach(item => {
                    const itemCategories = item.getAttribute('data-category').split(' ');
                    if (category === 'all' || itemCategories.includes(category)) {
                        item.style.display = 'block';
                        item.style.opacity = '1';
                        item.style.transform = 'translateY(0)';
                    } else {
                        item.style.display = 'none';
                        item.style.opacity = '0';
                    }
                });
                
                // Step 2: Destroy and recreate Masonry to only manage visible items
                if (window.msnry) {
                    setTimeout(() => {
                        // Destroy current Masonry instance
                        window.msnry.destroy();
                        
                        // Recreate Masonry - only select visible items (not display:none)
                        window.msnry = new Masonry(document.querySelector('.gallery-grid'), {
                            itemSelector: '.gallery-item:not([style*="display: none"])',
                            columnWidth: '.gallery-item',
                            percentPosition: true,
                            gutter: 8
                        });
                    }, 50);
                }
            });
        });

        // Initialize gallery functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Masonry
            const grid = document.querySelector('.gallery-grid');
            window.msnry = null;
            
            // Wait for images to load before initializing Masonry
            const images = grid.querySelectorAll('img');
            let imagesLoaded = 0;
            
            function checkAllImagesLoaded() {
                imagesLoaded++;
                if (imagesLoaded === images.length) {
                    // All images loaded, initialize Masonry
                    window.msnry = new Masonry(grid, {
                        itemSelector: '.gallery-item',
                        columnWidth: '.gallery-item',
                        percentPosition: true,
                        gutter: 8
                    });
                    
                    // Animate items in
                    document.querySelectorAll('.gallery-item').forEach((el, index) => {
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                        setTimeout(() => {
                            el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                            el.style.opacity = '1';
                            el.style.transform = 'translateY(0)';
                        }, index * 50);
                    });
                }
            }
            
            images.forEach(img => {
                if (img.complete) {
                    checkAllImagesLoaded();
                } else {
                    img.addEventListener('load', checkAllImagesLoaded);
                    img.addEventListener('error', checkAllImagesLoaded);
                }
            });
            
            // Lightbox functionality
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.addEventListener('click', function() {
                    const img = this.querySelector('img');
                    if (img) {
                        const lightbox = document.getElementById('lightbox');
                        const lightboxImg = document.getElementById('lightboxImg');
                        lightboxImg.src = img.src;
                        lightboxImg.alt = img.alt;
                        lightbox.classList.add('active');
                    }
                });
            });
            
            // Re-layout Masonry when window resizes
            window.addEventListener('resize', function() {
                if (window.msnry) {
                    window.msnry.layout();
                }
            });
        });
        
        // Lightbox close functionality
        document.getElementById('lightboxClose').addEventListener('click', function() {
            document.getElementById('lightbox').classList.remove('active');
        });
        
        // Close lightbox when clicking outside the image
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });
        
        // Close lightbox with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('lightbox').classList.remove('active');
            }
        });
    </script>
